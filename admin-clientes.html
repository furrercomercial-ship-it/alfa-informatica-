<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clientes — Painel Admin</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('alfa_theme')||'dark';</script>
<link rel="stylesheet" href="admin.css">
<style>
.detail-section{margin-bottom:18px;}
.detail-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px;}
.detail-line{font-size:13px;color:var(--text-secondary);margin-bottom:3px;}
.mini-order{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border-color);}
.mini-order:last-child{border-bottom:none;}
.pagination-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 4px 4px;font-size:12.5px;color:var(--text-muted);}
.pagination-bar .pg-controls{display:flex;align-items:center;gap:10px;}
.pagination-bar .pg-page{color:var(--text-muted);}
</style>
</head>
<body>

<div class="admin-shell">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-main">
    <div class="admin-topbar"><div class="admin-topbar-title">Clientes</div></div>
    <div class="admin-content">
      <div class="admin-insight-bar" id="admin-insight-bar" style="display:none"></div>

      <div class="toolbar">
        <div class="toolbar-left">
          <input type="search" id="searchInp" class="search-box" placeholder="Buscar por nome ou e-mail...">
          <button class="btn btn-secondary" id="exportCsvBtn">Exportar CSV</button>
        </div>
        <div id="cliCount" style="font-size:12.5px;color:var(--text-muted);"></div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Cliente</th><th>Telefone</th><th>Pedidos</th><th>Total Gasto</th><th>Última Compra</th><th>Status</th><th></th></tr></thead>
          <tbody id="cliTbody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="cliPagination"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cliModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="cliModalTitle">Cliente</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="cliDetail"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
      <button class="btn btn-danger" id="blockBtn">Bloquear</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="admin-shell.js"></script>
<script>
let CLIENTS = [];
let currentDetailId = null;
let canEdit = false;
let currentPage = 1;
const PAGE_SIZE = 25;

function fmtBRL(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 }); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('pt-BR'); }

/* ── CSV helpers ── */
function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(filename, rows) {
  const content = '﻿' + rows.map(r => r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

/* ── Paginação ── */
function renderPagination(containerId, totalItems, page, onChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  const start = totalItems ? (page - 1) * PAGE_SIZE + 1 : 0;
  const end = Math.min(page * PAGE_SIZE, totalItems);
  el.innerHTML = `
    <div class="pg-info">Mostrando ${start}–${end} de ${totalItems}</div>
    <div class="pg-controls">
      <button class="btn btn-secondary btn-sm" id="${containerId}PrevBtn" ${page <= 1 ? 'disabled' : ''}>Anterior</button>
      <span class="pg-page">Página ${page} de ${totalPages}</span>
      <button class="btn btn-secondary btn-sm" id="${containerId}NextBtn" ${page >= totalPages ? 'disabled' : ''}>Próxima</button>
    </div>`;
  document.getElementById(containerId + 'PrevBtn').addEventListener('click', () => onChange(page - 1));
  document.getElementById(containerId + 'NextBtn').addEventListener('click', () => onChange(page + 1));
}

async function loadClients() {
  const [{ data: profiles }, { data: orders }] = await Promise.all([
    window.sb.from('profiles').select('id,full_name,email,cpf,phone,is_blocked,created_at').eq('role', 'cliente').order('created_at', { ascending: false }),
    window.sb.from('orders').select('id,user_id,total,status,created_at,order_number'),
  ]);

  CLIENTS = (profiles || []).map(p => {
    const myOrders = (orders || []).filter(o => o.user_id === p.id);
    const spent = myOrders.filter(o => o.status !== 'cancelado').reduce((s, o) => s + Number(o.total), 0);
    const last = myOrders.length ? myOrders.reduce((a, b) => new Date(a.created_at) > new Date(b.created_at) ? a : b) : null;
    return { ...p, orderCount: myOrders.length, spent, lastPurchase: last ? last.created_at : null, orders: myOrders };
  });
  renderTable();
}

function getFilteredClients() {
  const q = document.getElementById('searchInp').value.trim().toLowerCase();
  return CLIENTS.filter(c => !q || (c.full_name || '').toLowerCase().includes(q));
}

function renderTable() {
  const list = getFilteredClients();
  document.getElementById('cliCount').textContent = list.length + ' cliente' + (list.length !== 1 ? 's' : '');

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const tbody = document.getElementById('cliTbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="table-empty">Nenhum cliente encontrado.</td></tr>';
    renderPagination('cliPagination', 0, currentPage, p => { currentPage = p; renderTable(); });
    return;
  }
  tbody.innerHTML = pageItems.map(c => `
    <tr>
      <td class="strong">${c.full_name || '—'}</td>
      <td>${c.phone || '—'}</td>
      <td>${c.orderCount}</td>
      <td class="strong">${fmtBRL(c.spent)}</td>
      <td>${c.lastPurchase ? fmtDate(c.lastPurchase) : '—'}</td>
      <td>${c.is_blocked ? '<span class="status-pill red">Bloqueado</span>' : '<span class="status-pill green">Ativo</span>'}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="openDetail('${c.id}')">Ver detalhes</button></td>
    </tr>`).join('');
  renderPagination('cliPagination', list.length, currentPage, p => { currentPage = p; renderTable(); });
}

function exportClientsCsv() {
  const list = getFilteredClients();
  const rows = [['Nome', 'E-mail', 'CPF', 'Telefone', 'Status', 'Data de Cadastro']];
  list.forEach(c => {
    rows.push([
      c.full_name || '',
      c.email || '',
      c.cpf || '',
      c.phone || '',
      c.is_blocked ? 'Bloqueado' : 'Ativo',
      fmtDate(c.created_at),
    ]);
  });
  downloadCsv('clientes-' + todayStr() + '.csv', rows);
}

window.openDetail = function (id) {
  const c = CLIENTS.find(x => x.id === id);
  if (!c) return;
  currentDetailId = id;
  document.getElementById('cliModalTitle').textContent = c.full_name || 'Cliente';
  document.getElementById('cliDetail').innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">Dados</div>
      <div class="detail-line">CPF: ${c.cpf || '—'}</div>
      <div class="detail-line">Telefone: ${c.phone || '—'}</div>
      <div class="detail-line">Cliente desde: ${fmtDate(c.created_at)}</div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Resumo</div>
      <div class="detail-line">${c.orderCount} pedido${c.orderCount !== 1 ? 's' : ''} · Total gasto: ${fmtBRL(c.spent)}</div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Histórico de Pedidos</div>
      ${c.orders.length ? c.orders.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(o =>
        `<div class="mini-order"><span>#${o.order_number || o.id} · ${fmtDate(o.created_at)}</span><span>${fmtBRL(o.total)}</span></div>`
      ).join('') : '<div class="detail-line">Nenhum pedido ainda.</div>'}
    </div>`;

  const blockBtn = document.getElementById('blockBtn');
  blockBtn.textContent = c.is_blocked ? 'Desbloquear' : 'Bloquear';
  blockBtn.style.display = canEdit ? 'inline-flex' : 'none';
  document.getElementById('cliModal').classList.add('open');
};

document.getElementById('blockBtn').addEventListener('click', async () => {
  const c = CLIENTS.find(x => x.id === currentDetailId);
  if (!c) return;
  const { error } = await window.sb.from('profiles').update({ is_blocked: !c.is_blocked }).eq('id', c.id);
  if (error) { AdminShell.toast('Erro: ' + error.message, 'error'); return; }
  AdminShell.logAction(c.is_blocked ? 'desbloquear_cliente' : 'bloquear_cliente', 'cliente', c.id, { nome: c.full_name });
  closeModal();
  loadClients();
});

function closeModal() { document.getElementById('cliModal').classList.remove('open'); }
document.getElementById('searchInp').addEventListener('input', () => { currentPage = 1; renderTable(); });
document.getElementById('exportCsvBtn').addEventListener('click', exportClientsCsv);

(async function () {
  const session = await AdminShell.init('clientes');
  if (!session) return;
  canEdit = AdminShell.can('clientes.editar');
  await loadClients();
})();
</script>
</body>
</html>
