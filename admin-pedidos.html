<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos — Painel Admin</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('alfa_theme')||'dark';</script>
<link rel="stylesheet" href="admin.css">
<style>
.order-item-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);font-size:13px;}
.order-item-row:last-child{border-bottom:none;}
.detail-section{margin-bottom:18px;}
.detail-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px;}
.detail-line{font-size:13px;color:var(--text-secondary);margin-bottom:3px;}
.totals-box{margin-top:8px;padding-top:10px;border-top:1px solid var(--border-color);}
.totals-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.totals-row.grand{font-weight:800;font-size:14px;color:var(--text-main);}
.pagination-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 4px 4px;font-size:13px;color:var(--text-muted);}
.pagination-bar .pg-controls{display:flex;align-items:center;gap:10px;}
.pagination-bar .pg-page{color:var(--text-muted);}
.th-sort{cursor:pointer;user-select:none;}
.th-sort:hover{color:var(--text-main);}
.sort-ind{margin-left:4px;opacity:.7;}
.toolbar-select{background:var(--bg-main);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-main);padding:9px 12px;font-size:13px;outline:none;transition:border-color .15s var(--ease),box-shadow .15s var(--ease);}
.toolbar-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
</style>
</head>
<body>

<div class="admin-shell">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-main">
    <div class="admin-topbar"><div class="admin-topbar-title">Pedidos</div></div>
    <div class="admin-content">
      <div class="admin-insight-bar" id="admin-insight-bar" style="display:none"></div>

      <div class="toolbar">
        <div class="toolbar-left">
          <input type="search" id="searchInp" class="search-box" placeholder="Buscar por nº do pedido...">
          <select id="statusFilter" class="toolbar-select" aria-label="Filtrar por status">
            <option value="">Todos os status</option>
            <option value="aguardando_pagamento">Aguardando Pagamento</option>
            <option value="processando">Processando</option>
            <option value="pago">Pago</option>
            <option value="preparando">Em Preparação</option>
            <option value="enviado">Em Transporte</option>
            <option value="entregue">Entregue</option>
            <option value="cancelado">Cancelado</option>
            <option value="recusado">Pagamento Recusado</option>
            <option value="estornado">Estornado</option>
            <option value="estorno_parcial">Estornado Parcialmente</option>
            <option value="expirado">Expirado</option>
          </select>
          <button class="btn btn-secondary" id="exportCsvBtn">Exportar CSV</button>
        </div>
        <div id="ordCount" style="font-size:13px;color:var(--text-muted);"></div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th id="selectAllTh" style="width:34px;display:none;"><input type="checkbox" id="selectAllChk" onchange="toggleSelectAll(this.checked)" aria-label="Selecionar todos os pedidos desta página"></th>
            <th>Pedido</th><th>Cliente</th>
            <th class="th-sort" onclick="toggleSort('created_at')">Data<span id="sortIndcreated_at" class="sort-ind"></span></th>
            <th class="th-sort" onclick="toggleSort('total')">Total<span id="sortIndtotal" class="sort-ind"></span></th>
            <th>Status</th><th></th>
          </tr></thead>
          <tbody id="ordTbody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="ordPagination"></div>
      <div class="card" id="bulkBar" style="display:none;margin-top:14px;padding:14px 18px;">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span id="bulkCount" style="font-size:13px;color:var(--text-secondary);font-weight:700;"></span>
          <select id="bulkStatusSelect" class="toolbar-select" aria-label="Mudar status dos pedidos selecionados">
            <option value="">Mudar status selecionado(s) para...</option>
          </select>
          <button class="btn btn-primary btn-sm" id="bulkApplyBtn" onclick="applyBulkStatus()">Aplicar</button>
          <button class="btn btn-secondary btn-sm" onclick="clearSelection()">Limpar seleção</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="ordModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="ordModalTitle">Pedido</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="ordDetail"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="admin-shell.js"></script>
<script>
const STATUS_LABELS = {
  aguardando_pagamento:'Aguardando Pagamento', processando:'Processando', pago:'Pago',
  preparando:'Em Preparação', enviado:'Em Transporte', entregue:'Entregue', cancelado:'Cancelado',
  recusado:'Pagamento Recusado', estornado:'Estornado', estorno_parcial:'Estornado Parcialmente', expirado:'Expirado',
};
const STATUS_COLORS = {
  // "pago" é verde (não azul) por regra do DESIGN.md: verde é reservado pra
  // sucesso/confirmado — o estado que a equipe mais precisa confiar de relance.
  aguardando_pagamento:'amber', processando:'amber', pago:'green', preparando:'blue', enviado:'blue', entregue:'green',
  cancelado:'red', recusado:'red', estornado:'red', estorno_parcial:'amber', expirado:'gray',
};
let ORDERS = [];
let canEdit = false;
let currentPage = 1;
const PAGE_SIZE = 25;
let sortKey = null, sortDir = 'asc';
let selectedIds = new Set();

function fmtBRL(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 }); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

/* ── CSV helpers ── */
function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(filename, rows) {
  const content = '﻿' + rows.map(r => r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

/* ── Paginação ── */
function renderPagination(containerId, totalItems, page, onChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  const start = totalItems ? (page - 1) * PAGE_SIZE + 1 : 0;
  const end = Math.min(page * PAGE_SIZE, totalItems);
  el.innerHTML = `
    <div class="pg-info">Mostrando ${start}–${end} de ${totalItems}</div>
    <div class="pg-controls">
      <button class="btn btn-secondary btn-sm" id="${containerId}PrevBtn" ${page <= 1 ? 'disabled' : ''}>Anterior</button>
      <span class="pg-page">Página ${page} de ${totalPages}</span>
      <button class="btn btn-secondary btn-sm" id="${containerId}NextBtn" ${page >= totalPages ? 'disabled' : ''}>Próxima</button>
    </div>`;
  document.getElementById(containerId + 'PrevBtn').addEventListener('click', () => onChange(page - 1));
  document.getElementById(containerId + 'NextBtn').addEventListener('click', () => onChange(page + 1));
}

function renderSkeletonRows(n) {
  const tbody = document.getElementById('ordTbody');
  if (!tbody) return;
  tbody.innerHTML = Array.from({ length: n }).map(() => `
    <tr>
      <td><div class="skeleton" style="width:16px;height:16px;">·</div></td>
      <td><div class="skeleton" style="width:90px;height:14px;">·</div></td>
      <td><div class="skeleton" style="width:140px;height:14px;">·</div></td>
      <td><div class="skeleton" style="width:110px;height:14px;">·</div></td>
      <td><div class="skeleton" style="width:80px;height:14px;">·</div></td>
      <td><div class="skeleton" style="width:74px;height:20px;border-radius:999px;">·</div></td>
      <td><div class="skeleton" style="width:96px;height:28px;">·</div></td>
    </tr>`).join('');
}

async function loadOrders() {
  renderSkeletonRows(6);
  const { data, error } = await window.sb
    .from('orders')
    .select('id,order_number,status,total,created_at,profiles(full_name)')
    .order('created_at', { ascending: false });
  if (error) {
    console.error(error);
    AdminShell.toast('Erro ao carregar pedidos: ' + error.message, 'error');
    document.getElementById('ordTbody').innerHTML = '<tr><td colspan="7" class="table-empty">Não foi possível carregar os pedidos. Recarregue a página.</td></tr>';
    return;
  }
  ORDERS = data || [];
  renderTable();
}

function getFilteredOrders() {
  // Tira o "#" do início — o número do pedido aparece como "#ALFA-..." em
  // toda a tela, então é natural digitar/colar com o # junto.
  const q = document.getElementById('searchInp').value.trim().toLowerCase().replace(/^#/, '');
  const statusF = document.getElementById('statusFilter').value;
  let list = ORDERS.filter(o => {
    if (q && !(o.order_number || '').toLowerCase().includes(q)) return false;
    if (statusF && o.status !== statusF) return false;
    return true;
  });
  if (sortKey) {
    list = [...list].sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'created_at') { av = new Date(av).getTime(); bv = new Date(bv).getTime(); }
      else { av = Number(av); bv = Number(bv); }
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }
  return list;
}

// Clicar num cabeçalho ordenável alterna asc/desc; trocar de coluna reseta pra asc.
window.toggleSort = function (key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = 'asc'; }
  currentPage = 1;
  renderTable();
};

window.toggleSelectAll = function (checked) {
  const list = getFilteredOrders();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const pageItems = list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  pageItems.forEach(o => { if (checked) selectedIds.add(o.id); else selectedIds.delete(o.id); });
  renderTable();
};

window.toggleSelectRow = function (id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  renderTable();
};

window.clearSelection = function () {
  selectedIds.clear();
  renderTable();
};

function renderTable() {
  const list = getFilteredOrders();
  document.getElementById('ordCount').textContent = list.length + ' pedido' + (list.length !== 1 ? 's' : '');

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  // Indicadores de ordenação nos cabeçalhos.
  ['created_at', 'total'].forEach(key => {
    const el = document.getElementById('sortInd' + key);
    if (el) el.textContent = sortKey === key ? (sortDir === 'asc' ? '▲' : '▼') : '';
  });

  const tbody = document.getElementById('ordTbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="table-empty">Nenhum pedido encontrado.</td></tr>';
    renderPagination('ordPagination', 0, currentPage, p => { currentPage = p; renderTable(); });
    updateBulkBar();
    return;
  }
  tbody.innerHTML = pageItems.map(o => `
    <tr>
      ${canEdit ? `<td><input type="checkbox" ${selectedIds.has(o.id) ? 'checked' : ''} onchange="toggleSelectRow(${o.id},this.checked)" aria-label="Selecionar pedido #${o.order_number || o.id}"></td>` : ''}
      <td class="strong">#${o.order_number || o.id}</td>
      <td>${o.profiles ? o.profiles.full_name : 'Visitante'}</td>
      <td>${fmtDate(o.created_at)}</td>
      <td class="strong">${fmtBRL(o.total)}</td>
      <td><span class="status-pill ${STATUS_COLORS[o.status] || 'gray'}">${STATUS_LABELS[o.status] || o.status}</span></td>
      <td><button class="btn btn-secondary btn-sm" onclick="openDetail(${o.id})">Ver detalhes</button></td>
    </tr>`).join('');
  const selectAllChk = document.getElementById('selectAllChk');
  if (selectAllChk) selectAllChk.checked = canEdit && pageItems.length > 0 && pageItems.every(o => selectedIds.has(o.id));
  updateBulkBar();
  renderPagination('ordPagination', list.length, currentPage, p => { currentPage = p; renderTable(); });
}

function exportOrdersCsv() {
  const list = getFilteredOrders();
  const rows = [['Nº Pedido', 'Cliente', 'Data', 'Status', 'Total']];
  list.forEach(o => {
    rows.push([
      o.order_number || o.id,
      o.profiles ? o.profiles.full_name : 'Visitante',
      fmtDate(o.created_at),
      STATUS_LABELS[o.status] || o.status,
      Number(o.total).toFixed(2).replace('.', ','),
    ]);
  });
  downloadCsv('pedidos-' + todayStr() + '.csv', rows);
}

window.openDetail = async function (id) {
  const { data: order, error } = await window.sb.from('orders').select('*, profiles(full_name,cpf,phone)').eq('id', id).single();
  if (error || !order) return;
  const { data: items } = await window.sb.from('order_items').select('*').eq('order_id', id);
  const addr = order.address_snapshot || {};

  document.getElementById('ordModalTitle').textContent = 'Pedido #' + (order.order_number || order.id);
  document.getElementById('ordDetail').innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">Status</div>
      <div class="field" style="margin-bottom:10px;">
        <select id="statusSelect" ${canEdit ? '' : 'disabled'} aria-label="Status do pedido">
          <optgroup label="Em andamento">
            ${['aguardando_pagamento','processando','pago','preparando','enviado'].map(k => `<option value="${k}" ${k===order.status?'selected':''}>${STATUS_LABELS[k]}</option>`).join('')}
          </optgroup>
          <optgroup label="Finalizado">
            ${['entregue'].map(k => `<option value="${k}" ${k===order.status?'selected':''}>${STATUS_LABELS[k]}</option>`).join('')}
          </optgroup>
          <optgroup label="Cancelado / Problema">
            ${['cancelado','recusado','estornado','estorno_parcial','expirado'].map(k => `<option value="${k}" ${k===order.status?'selected':''}>${STATUS_LABELS[k]}</option>`).join('')}
          </optgroup>
        </select>
      </div>
      ${canEdit ? '<button class="btn btn-primary btn-sm" id="saveStatusBtn" onclick="saveStatus(' + id + ')">Salvar Status</button>' : ''}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Cliente</div>
      <div class="detail-line">${order.profiles ? order.profiles.full_name : 'Visitante (sem conta)'}</div>
      ${order.profiles && order.profiles.phone ? `<div class="detail-line">${order.profiles.phone}</div>` : ''}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Endereço de entrega</div>
      ${addr.rua ? `<div class="detail-line">${addr.rua}${addr.numero ? ', ' + addr.numero : ''} ${addr.compl || ''}</div>
        <div class="detail-line">${addr.bairro || ''} ${addr.cid || ''}/${addr.uf || ''} · CEP ${addr.cep || ''}</div>
        <div class="detail-line">Destinatário: ${addr.dest || '—'} · ${addr.tel || ''}</div>`
        : '<div class="detail-line">Sem endereço registrado.</div>'}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Envio e Pagamento</div>
      <div class="detail-line">Envio: ${order.shipping_method || '—'}</div>
      <div class="detail-line">Pagamento: ${order.payment_method || '—'}</div>
      ${order.tracking_code ? `<div class="detail-line">Rastreio: ${order.tracking_code}</div>` : ''}
      ${order.label_data ? `<div class="detail-line">Etiqueta gerada${order.label_data.labelUrl ? ` — <a href="${order.label_data.labelUrl}" target="_blank">abrir/imprimir</a>` : ''}</div>` : ''}
      ${canEdit && order.correios_servico_codigo && !order.label_data && ['pago','preparando'].includes(order.status)
        ? `<button class="btn btn-secondary btn-sm" id="gerarEtiquetaBtn" style="margin-top:8px;" onclick="gerarEtiqueta(${id})">Gerar etiqueta</button>` : ''}
      ${canEdit && order.tracking_code
        ? `<button class="btn btn-secondary btn-sm" id="atualizarRastreioBtn" style="margin-top:8px;margin-left:6px;" onclick="atualizarRastreio(${id})">Atualizar rastreio</button><div id="trackingEvents"></div>` : ''}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Itens</div>
      ${(items || []).map(i => `<div class="order-item-row"><span>${i.qty}x ${i.product_name_snapshot}</span><span>${fmtBRL(i.line_total)}</span></div>`).join('') || '<div class="detail-line">Nenhum item.</div>'}
      <div class="totals-box">
        <div class="totals-row"><span>Subtotal</span><span>${fmtBRL(order.subtotal)}</span></div>
        ${order.discount ? `<div class="totals-row"><span>Desconto</span><span>− ${fmtBRL(order.discount)}</span></div>` : ''}
        <div class="totals-row"><span>Frete</span><span>${order.freight ? fmtBRL(order.freight) : 'Grátis'}</span></div>
        <div class="totals-row grand"><span>Total</span><span>${fmtBRL(order.total)}</span></div>
      </div>
    </div>`;

  document.getElementById('ordModal').classList.add('open');
};

// Transições pra estado terminal/negativo pedem confirmação explícita antes
// de gravar — reembolso/cancelamento não tem "desfazer" automático depois.
const RISKY_STATUSES = new Set(['cancelado', 'recusado', 'estornado', 'estorno_parcial', 'expirado']);

window.saveStatus = async function (id) {
  const btn = document.getElementById('saveStatusBtn');
  const status = document.getElementById('statusSelect').value;
  const before = ORDERS.find(o => o.id === id);

  if (RISKY_STATUSES.has(status) && status !== (before && before.status)) {
    const label = STATUS_LABELS[status] || status;
    const numero = (before && before.order_number) || id;
    if (!confirm(`Mudar o pedido #${numero} para "${label}"? Essa mudança não tem desfazer automático — confira antes de salvar.`)) return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  const { error } = await window.sb.from('orders').update({ status }).eq('id', id);
  if (error) {
    AdminShell.toast('Erro ao salvar: ' + error.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Salvar Status'; }
    return;
  }
  AdminShell.logAction('alterar_status_pedido', 'pedido', id, { de: before && before.status, para: status });
  AdminShell.toast('Status atualizado!', 'success');
  closeModal();
  loadOrders();
};

window.gerarEtiqueta = async function (id) {
  if (!confirm('Gerar etiqueta de envio pra este pedido? Isso solicita a etiqueta de verdade nos Correios e não pode ser desfeito.')) return;
  const btn = document.getElementById('gerarEtiquetaBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Gerando...'; }
  const resp = await window.sb.functions.invoke('correios-etiqueta', { body: { order_id: id } });
  if (!resp.data || resp.data.ok === false) {
    AdminShell.toast('Erro ao gerar etiqueta: ' + ((resp.data && resp.data.error) || 'tente novamente'), 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Gerar etiqueta'; }
    return;
  }
  AdminShell.toast('Etiqueta gerada!', 'success');
  openDetail(id);
  loadOrders();
};

window.atualizarRastreio = async function (id) {
  const btn = document.getElementById('atualizarRastreioBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Atualizando...'; }
  const resp = await window.sb.functions.invoke('correios-rastreio', { body: { order_id: id } });
  if (!resp.data || resp.data.ok === false) {
    AdminShell.toast('Erro ao atualizar rastreio: ' + ((resp.data && resp.data.error) || 'tente novamente'), 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Atualizar rastreio'; }
    return;
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Atualizar rastreio'; }
  const box = document.getElementById('trackingEvents');
  if (box) {
    box.innerHTML = (resp.data.eventos || []).map(e =>
      `<div class="detail-line">${e.dataHora || ''} — ${e.descricao || ''}</div>`
    ).join('') || '<div class="detail-line">Sem eventos ainda.</div>';
  }
  if (resp.data.status_atualizado) {
    AdminShell.toast('Pedido marcado como Entregue!', 'success');
    loadOrders();
  }
};

function closeModal() { document.getElementById('ordModal').classList.remove('open'); }

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  if (!bar) return;
  if (!canEdit || selectedIds.size === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  document.getElementById('bulkCount').textContent = selectedIds.size + ' pedido' + (selectedIds.size !== 1 ? 's' : '') + ' selecionado' + (selectedIds.size !== 1 ? 's' : '');
}

window.applyBulkStatus = async function () {
  const status = document.getElementById('bulkStatusSelect').value;
  const ids = [...selectedIds];
  if (!status || !ids.length) return;
  const label = STATUS_LABELS[status] || status;
  const aviso = RISKY_STATUSES.has(status) ? ' Essa mudança não tem desfazer automático.' : '';
  if (!confirm(`Mudar ${ids.length} pedido(s) selecionado(s) para "${label}"?${aviso}`)) return;

  const btn = document.getElementById('bulkApplyBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Aplicando...'; }
  let okCount = 0, errCount = 0;
  for (const id of ids) {
    const before = ORDERS.find(o => o.id === id);
    const { error } = await window.sb.from('orders').update({ status }).eq('id', id);
    if (error) { errCount++; continue; }
    AdminShell.logAction('alterar_status_pedido', 'pedido', id, { de: before && before.status, para: status, lote: true });
    okCount++;
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Aplicar'; }
  AdminShell.toast(okCount + ' pedido(s) atualizado(s)' + (errCount ? `, ${errCount} com erro` : '') + '.', errCount ? 'error' : 'success');
  document.getElementById('bulkStatusSelect').value = '';
  selectedIds.clear();
  loadOrders();
};

document.getElementById('searchInp').addEventListener('input', () => { currentPage = 1; renderTable(); });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; renderTable(); });
document.getElementById('exportCsvBtn').addEventListener('click', exportOrdersCsv);

// Opções do select de mudança em lote — as mesmas do STATUS_LABELS, montadas
// uma vez só (o valor não muda em tempo de execução).
Object.entries(STATUS_LABELS).forEach(([k, v]) => {
  const opt = document.createElement('option');
  opt.value = k; opt.textContent = v;
  document.getElementById('bulkStatusSelect').appendChild(opt);
});

(async function () {
  const session = await AdminShell.init('pedidos');
  if (!session) return;
  canEdit = AdminShell.can('pedidos.editar');
  document.getElementById('selectAllTh').style.display = canEdit ? '' : 'none';
  await loadOrders();
})();
</script>
</body>
</html>
