<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos — Painel Admin</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('alfa_theme')||'dark';</script>
<link rel="stylesheet" href="admin.css">
<style>
.order-item-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-color);font-size:12.5px;}
.order-item-row:last-child{border-bottom:none;}
.detail-section{margin-bottom:18px;}
.detail-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px;}
.detail-line{font-size:13px;color:var(--text-secondary);margin-bottom:3px;}
.totals-box{margin-top:8px;padding-top:10px;border-top:1px solid var(--border-color);}
.totals-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.totals-row.grand{font-weight:800;font-size:15px;color:var(--text-main);}
.pagination-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 4px 4px;font-size:12.5px;color:var(--text-muted);}
.pagination-bar .pg-controls{display:flex;align-items:center;gap:10px;}
.pagination-bar .pg-page{color:var(--text-muted);}
</style>
</head>
<body>

<div class="admin-shell">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-main">
    <div class="admin-topbar"><div class="admin-topbar-title">Pedidos</div></div>
    <div class="admin-content">
      <div class="admin-insight-bar" id="admin-insight-bar" style="display:none"></div>

      <div class="toolbar">
        <div class="toolbar-left">
          <input type="search" id="searchInp" class="search-box" placeholder="Buscar por nº do pedido...">
          <select id="statusFilter" style="padding:9px 12px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-main);">
            <option value="">Todos os status</option>
            <option value="aguardando_pagamento">Aguardando Pagamento</option>
            <option value="processando">Processando</option>
            <option value="pago">Pago</option>
            <option value="preparando">Em Preparação</option>
            <option value="enviado">Em Transporte</option>
            <option value="entregue">Entregue</option>
            <option value="cancelado">Cancelado</option>
            <option value="recusado">Pagamento Recusado</option>
            <option value="estornado">Estornado</option>
            <option value="estorno_parcial">Estornado Parcialmente</option>
            <option value="expirado">Expirado</option>
          </select>
          <button class="btn btn-secondary" id="exportCsvBtn">Exportar CSV</button>
        </div>
        <div id="ordCount" style="font-size:12.5px;color:var(--text-muted);"></div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Pedido</th><th>Cliente</th><th>Data</th><th>Total</th><th>Status</th><th></th></tr></thead>
          <tbody id="ordTbody"></tbody>
        </table>
      </div>
      <div class="pagination-bar" id="ordPagination"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="ordModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="ordModalTitle">Pedido</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div id="ordDetail"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="admin-shell.js"></script>
<script>
const STATUS_LABELS = {
  aguardando_pagamento:'Aguardando Pagamento', processando:'Processando', pago:'Pago',
  preparando:'Em Preparação', enviado:'Em Transporte', entregue:'Entregue', cancelado:'Cancelado',
  recusado:'Pagamento Recusado', estornado:'Estornado', estorno_parcial:'Estornado Parcialmente', expirado:'Expirado',
};
const STATUS_COLORS = {
  aguardando_pagamento:'amber', processando:'amber', pago:'blue', preparando:'blue', enviado:'blue', entregue:'green',
  cancelado:'red', recusado:'red', estornado:'red', estorno_parcial:'amber', expirado:'gray',
};
let ORDERS = [];
let canEdit = false;
let currentPage = 1;
const PAGE_SIZE = 25;

function fmtBRL(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 }); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

/* ── CSV helpers ── */
function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(filename, rows) {
  const content = '﻿' + rows.map(r => r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

/* ── Paginação ── */
function renderPagination(containerId, totalItems, page, onChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  const start = totalItems ? (page - 1) * PAGE_SIZE + 1 : 0;
  const end = Math.min(page * PAGE_SIZE, totalItems);
  el.innerHTML = `
    <div class="pg-info">Mostrando ${start}–${end} de ${totalItems}</div>
    <div class="pg-controls">
      <button class="btn btn-secondary btn-sm" id="${containerId}PrevBtn" ${page <= 1 ? 'disabled' : ''}>Anterior</button>
      <span class="pg-page">Página ${page} de ${totalPages}</span>
      <button class="btn btn-secondary btn-sm" id="${containerId}NextBtn" ${page >= totalPages ? 'disabled' : ''}>Próxima</button>
    </div>`;
  document.getElementById(containerId + 'PrevBtn').addEventListener('click', () => onChange(page - 1));
  document.getElementById(containerId + 'NextBtn').addEventListener('click', () => onChange(page + 1));
}

async function loadOrders() {
  const { data, error } = await window.sb
    .from('orders')
    .select('id,order_number,status,total,created_at,profiles(full_name)')
    .order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  ORDERS = data || [];
  renderTable();
}

function getFilteredOrders() {
  // Tira o "#" do início — o número do pedido aparece como "#ALFA-..." em
  // toda a tela, então é natural digitar/colar com o # junto.
  const q = document.getElementById('searchInp').value.trim().toLowerCase().replace(/^#/, '');
  const statusF = document.getElementById('statusFilter').value;
  return ORDERS.filter(o => {
    if (q && !(o.order_number || '').toLowerCase().includes(q)) return false;
    if (statusF && o.status !== statusF) return false;
    return true;
  });
}

function renderTable() {
  const list = getFilteredOrders();
  document.getElementById('ordCount').textContent = list.length + ' pedido' + (list.length !== 1 ? 's' : '');

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const tbody = document.getElementById('ordTbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="table-empty">Nenhum pedido encontrado.</td></tr>';
    renderPagination('ordPagination', 0, currentPage, p => { currentPage = p; renderTable(); });
    return;
  }
  tbody.innerHTML = pageItems.map(o => `
    <tr>
      <td class="strong">#${o.order_number || o.id}</td>
      <td>${o.profiles ? o.profiles.full_name : 'Visitante'}</td>
      <td>${fmtDate(o.created_at)}</td>
      <td class="strong">${fmtBRL(o.total)}</td>
      <td><span class="status-pill ${STATUS_COLORS[o.status] || 'gray'}">${STATUS_LABELS[o.status] || o.status}</span></td>
      <td><button class="btn btn-secondary btn-sm" onclick="openDetail(${o.id})">Ver detalhes</button></td>
    </tr>`).join('');
  renderPagination('ordPagination', list.length, currentPage, p => { currentPage = p; renderTable(); });
}

function exportOrdersCsv() {
  const list = getFilteredOrders();
  const rows = [['Nº Pedido', 'Cliente', 'Data', 'Status', 'Total']];
  list.forEach(o => {
    rows.push([
      o.order_number || o.id,
      o.profiles ? o.profiles.full_name : 'Visitante',
      fmtDate(o.created_at),
      STATUS_LABELS[o.status] || o.status,
      Number(o.total).toFixed(2).replace('.', ','),
    ]);
  });
  downloadCsv('pedidos-' + todayStr() + '.csv', rows);
}

window.openDetail = async function (id) {
  const { data: order, error } = await window.sb.from('orders').select('*, profiles(full_name,cpf,phone)').eq('id', id).single();
  if (error || !order) return;
  const { data: items } = await window.sb.from('order_items').select('*').eq('order_id', id);
  const addr = order.address_snapshot || {};

  document.getElementById('ordModalTitle').textContent = 'Pedido #' + (order.order_number || order.id);
  document.getElementById('ordDetail').innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">Status</div>
      <select id="statusSelect" ${canEdit ? '' : 'disabled'} style="width:100%;background:var(--bg-main);border:1px solid var(--border-color);color:var(--text-main);padding:10px 12px;">
        ${Object.entries(STATUS_LABELS).map(([k,v]) => `<option value="${k}" ${k===order.status?'selected':''}>${v}</option>`).join('')}
      </select>
      ${canEdit ? '<button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="saveStatus(' + id + ')">Salvar Status</button>' : ''}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Cliente</div>
      <div class="detail-line">${order.profiles ? order.profiles.full_name : 'Visitante (sem conta)'}</div>
      ${order.profiles && order.profiles.phone ? `<div class="detail-line">${order.profiles.phone}</div>` : ''}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Endereço de entrega</div>
      ${addr.rua ? `<div class="detail-line">${addr.rua}${addr.numero ? ', ' + addr.numero : ''} ${addr.compl || ''}</div>
        <div class="detail-line">${addr.bairro || ''} ${addr.cid || ''}/${addr.uf || ''} · CEP ${addr.cep || ''}</div>
        <div class="detail-line">Destinatário: ${addr.dest || '—'} · ${addr.tel || ''}</div>`
        : '<div class="detail-line">Sem endereço registrado.</div>'}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Envio e Pagamento</div>
      <div class="detail-line">Envio: ${order.shipping_method || '—'}</div>
      <div class="detail-line">Pagamento: ${order.payment_method || '—'}</div>
      ${order.tracking_code ? `<div class="detail-line">Rastreio: ${order.tracking_code}</div>` : ''}
      ${order.label_data ? `<div class="detail-line">Etiqueta gerada${order.label_data.labelUrl ? ` — <a href="${order.label_data.labelUrl}" target="_blank">abrir/imprimir</a>` : ''}</div>` : ''}
      ${canEdit && order.correios_servico_codigo && !order.label_data && ['pago','preparando'].includes(order.status)
        ? `<button class="btn btn-secondary btn-sm" style="margin-top:8px;" onclick="gerarEtiqueta(${id})">Gerar etiqueta</button>` : ''}
      ${canEdit && order.tracking_code
        ? `<button class="btn btn-secondary btn-sm" style="margin-top:8px;margin-left:6px;" onclick="atualizarRastreio(${id})">Atualizar rastreio</button><div id="trackingEvents"></div>` : ''}
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Itens</div>
      ${(items || []).map(i => `<div class="order-item-row"><span>${i.qty}x ${i.product_name_snapshot}</span><span>${fmtBRL(i.line_total)}</span></div>`).join('') || '<div class="detail-line">Nenhum item.</div>'}
      <div class="totals-box">
        <div class="totals-row"><span>Subtotal</span><span>${fmtBRL(order.subtotal)}</span></div>
        ${order.discount ? `<div class="totals-row"><span>Desconto</span><span>− ${fmtBRL(order.discount)}</span></div>` : ''}
        <div class="totals-row"><span>Frete</span><span>${order.freight ? fmtBRL(order.freight) : 'Grátis'}</span></div>
        <div class="totals-row grand"><span>Total</span><span>${fmtBRL(order.total)}</span></div>
      </div>
    </div>`;

  document.getElementById('ordModal').classList.add('open');
};

window.saveStatus = async function (id) {
  const status = document.getElementById('statusSelect').value;
  const before = ORDERS.find(o => o.id === id);
  const { error } = await window.sb.from('orders').update({ status }).eq('id', id);
  if (error) { AdminShell.toast('Erro ao salvar: ' + error.message, 'error'); return; }
  AdminShell.logAction('alterar_status_pedido', 'pedido', id, { de: before && before.status, para: status });
  AdminShell.toast('Status atualizado!', 'success');
  closeModal();
  loadOrders();
};

window.gerarEtiqueta = async function (id) {
  const resp = await window.sb.functions.invoke('correios-etiqueta', { body: { order_id: id } });
  if (!resp.data || resp.data.ok === false) {
    AdminShell.toast('Erro ao gerar etiqueta: ' + ((resp.data && resp.data.error) || 'tente novamente'), 'error');
    return;
  }
  AdminShell.toast('Etiqueta gerada!', 'success');
  openDetail(id);
  loadOrders();
};

window.atualizarRastreio = async function (id) {
  const resp = await window.sb.functions.invoke('correios-rastreio', { body: { order_id: id } });
  if (!resp.data || resp.data.ok === false) {
    AdminShell.toast('Erro ao atualizar rastreio: ' + ((resp.data && resp.data.error) || 'tente novamente'), 'error');
    return;
  }
  const box = document.getElementById('trackingEvents');
  if (box) {
    box.innerHTML = (resp.data.eventos || []).map(e =>
      `<div class="detail-line">${e.dataHora || ''} — ${e.descricao || ''}</div>`
    ).join('') || '<div class="detail-line">Sem eventos ainda.</div>';
  }
  if (resp.data.status_atualizado) {
    AdminShell.toast('Pedido marcado como Entregue!', 'success');
    loadOrders();
  }
};

function closeModal() { document.getElementById('ordModal').classList.remove('open'); }

document.getElementById('searchInp').addEventListener('input', () => { currentPage = 1; renderTable(); });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; renderTable(); });
document.getElementById('exportCsvBtn').addEventListener('click', exportOrdersCsv);

(async function () {
  const session = await AdminShell.init('pedidos');
  if (!session) return;
  canEdit = AdminShell.can('pedidos.editar');
  await loadOrders();
})();
</script>
</body>
</html>
