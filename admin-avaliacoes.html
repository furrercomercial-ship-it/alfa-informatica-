<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avaliações — Painel Admin</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('alfa_theme')||'dark';</script>
<link rel="stylesheet" href="admin.css">
<style>
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{padding:9px 18px;border:1px solid var(--border-color);border-radius:0;background:var(--bg-card);color:var(--text-secondary);font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.tab-btn .cnt{opacity:.75;margin-left:5px;}

.rv-list{display:flex;flex-direction:column;gap:14px;}
.rv-card{background:var(--bg-card);border:1px solid var(--border-color);padding:20px 22px;}
.rv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px;flex-wrap:wrap;}
.rv-prod{font-size:12.5px;color:var(--primary);font-weight:700;}
.rv-prod:hover{text-decoration:underline;}
.rv-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;}
.rv-name{font-size:13.5px;font-weight:700;}
.rv-date{font-size:11.5px;color:var(--text-muted);}
.rv-stars{display:inline-flex;gap:1px;}
.rv-title{font-size:13.5px;font-weight:700;margin:8px 0 4px;}
.rv-comment{font-size:13px;color:var(--text-secondary);line-height:1.6;}
.rv-media{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.rv-media img,.rv-media video{width:70px;height:70px;object-fit:cover;border:1px solid var(--border-color);}
.rv-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.pagination-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 4px 4px;font-size:12.5px;color:var(--text-muted);}
.pagination-bar .pg-controls{display:flex;align-items:center;gap:10px;}
.pagination-bar .pg-page{color:var(--text-muted);}
</style>
</head>
<body>

<div class="admin-shell">
  <div id="admin-sidebar-mount"></div>
  <div class="admin-main">
    <div class="admin-topbar"><div class="admin-topbar-title">Avaliações</div></div>
    <div class="admin-content">
      <div class="admin-insight-bar" id="admin-insight-bar" style="display:none"></div>
      <div class="toolbar">
        <div class="toolbar-left">
          <input type="search" id="searchInp" class="search-box" placeholder="Buscar por produto, cliente ou comentário...">
          <button class="btn btn-secondary" id="exportCsvBtn">Exportar CSV</button>
        </div>
      </div>
      <div class="tabs" id="tabsArea"></div>
      <div id="listArea"></div>
      <div class="pagination-bar" id="avPagination"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="admin-shell.js"></script>
<script>
let activeTab = 'pending';
let ALL_REVIEWS = [];
let canModerate = false;
const PRODUCT_NAMES = {};
let currentPage = 1;
const PAGE_SIZE = 25;

/* ── CSV helpers ── */
function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(filename, rows) {
  const content = '﻿' + rows.map(r => r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

/* ── Paginação ── */
function renderPagination(containerId, totalItems, page, onChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  const start = totalItems ? (page - 1) * PAGE_SIZE + 1 : 0;
  const end = Math.min(page * PAGE_SIZE, totalItems);
  el.innerHTML = `
    <div class="pg-info">Mostrando ${start}–${end} de ${totalItems}</div>
    <div class="pg-controls">
      <button class="btn btn-secondary btn-sm" id="${containerId}PrevBtn" ${page <= 1 ? 'disabled' : ''}>Anterior</button>
      <span class="pg-page">Página ${page} de ${totalPages}</span>
      <button class="btn btn-secondary btn-sm" id="${containerId}NextBtn" ${page >= totalPages ? 'disabled' : ''}>Próxima</button>
    </div>`;
  document.getElementById(containerId + 'PrevBtn').addEventListener('click', () => onChange(page - 1));
  document.getElementById(containerId + 'NextBtn').addEventListener('click', () => onChange(page + 1));
}

function starsHtml(n) {
  let out = '<span class="rv-stars">';
  for (let i = 1; i <= 5; i++) {
    out += `<svg width="14" height="14" viewBox="0 0 24 24" fill="${i<=n?'#F59E0B':'none'}" stroke="${i<=n?'#F59E0B':'var(--text-muted)'}" stroke-width="1.5"><polygon points="12 2 15 8.5 22 9.3 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9.3 9 8.5"/></svg>`;
  }
  return out + '</span>';
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

async function loadReviews() {
  const { data, error } = await window.sb.from('reviews').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  ALL_REVIEWS = data || [];

  const ids = [...new Set(ALL_REVIEWS.map(r => r.product_id))];
  if (ids.length) {
    const { data: prods } = await window.sb.from('products').select('id,name').in('id', ids);
    (prods || []).forEach(p => { PRODUCT_NAMES[p.id] = p.name; });
  }
  renderTabs();
  renderList();
}

function renderTabs() {
  const counts = {
    pending: ALL_REVIEWS.filter(r => r.status === 'pending').length,
    approved: ALL_REVIEWS.filter(r => r.status === 'approved').length,
    rejected: ALL_REVIEWS.filter(r => r.status === 'rejected').length,
    all: ALL_REVIEWS.length,
  };
  const tabs = [
    {id:'pending', label:'Pendentes'},
    {id:'approved', label:'Aprovadas'},
    {id:'rejected', label:'Rejeitadas'},
    {id:'all', label:'Todas'},
  ];
  document.getElementById('tabsArea').innerHTML = tabs.map(t =>
    `<button class="tab-btn ${activeTab===t.id?'active':''}" onclick="selectTab('${t.id}')">${t.label}<span class="cnt">${counts[t.id]}</span></button>`
  ).join('');
}

function selectTab(id) { activeTab = id; currentPage = 1; renderTabs(); renderList(); }

function getFilteredReviews() {
  const q = document.getElementById('searchInp').value.trim().toLowerCase();
  let list = activeTab === 'all' ? ALL_REVIEWS : ALL_REVIEWS.filter(r => r.status === activeTab);
  if (q) {
    list = list.filter(r =>
      (PRODUCT_NAMES[r.product_id] || '').toLowerCase().includes(q) ||
      (r.customer_name || '').toLowerCase().includes(q) ||
      (r.comment || '').toLowerCase().includes(q)
    );
  }
  return list;
}

function renderList() {
  const list = getFilteredReviews();
  const area = document.getElementById('listArea');
  if (!list.length) {
    area.innerHTML = '<div class="table-empty">Nenhuma avaliação nesta aba.</div>';
    renderPagination('avPagination', 0, currentPage, p => { currentPage = p; renderList(); });
    return;
  }
  const statusColor = { pending: 'amber', approved: 'green', rejected: 'red' };
  const statusLabel = { pending: 'Pendente', approved: 'Aprovada', rejected: 'Rejeitada' };

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = list.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  area.innerHTML = '<div class="rv-list">' + pageItems.map(r => `
    <div class="rv-card">
      <div class="rv-top">
        <div>
          <a class="rv-prod" href="produto.html?id=${encodeURIComponent(r.product_id)}" target="_blank" rel="noopener noreferrer">${escapeHtml(PRODUCT_NAMES[r.product_id] || ('Produto #' + r.product_id))}</a>
          <div class="rv-meta">
            <span class="rv-name">${escapeHtml(r.customer_name || 'Cliente')}</span>
            ${starsHtml(r.rating)}
            <span class="rv-date">${fmtDate(r.created_at)}</span>
          </div>
        </div>
        <span class="status-pill ${statusColor[r.status]}">${statusLabel[r.status]}</span>
      </div>
      ${r.title ? `<div class="rv-title">${escapeHtml(r.title)}</div>` : ''}
      <div class="rv-comment">${escapeHtml(r.comment)}</div>
      ${(r.media_urls && r.media_urls.length) ? `<div class="rv-media">${r.media_urls.map(m =>
        (m.type||'').startsWith('video') ? `<video src="${m.url}" controls></video>` : `<img src="${m.url}" alt="">`
      ).join('')}</div>` : ''}
      ${canModerate ? `<div class="rv-actions">
        ${r.status !== 'approved' ? `<button class="btn btn-success btn-sm" onclick="approveReview('${r.id}')">Aprovar</button>` : ''}
        ${r.status !== 'rejected' ? `<button class="btn btn-secondary btn-sm" onclick="rejectReview('${r.id}')">Rejeitar</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="removeReview('${r.id}')">Excluir</button>
      </div>` : ''}
    </div>`).join('') + '</div>';
  renderPagination('avPagination', list.length, currentPage, p => { currentPage = p; renderList(); });
}

function exportAvaliacoesCsv() {
  const list = getFilteredReviews();
  const statusLabel = { pending: 'Pendente', approved: 'Aprovada', rejected: 'Rejeitada' };
  const rows = [['Produto', 'Cliente', 'Nota', 'Comentário', 'Status', 'Data']];
  list.forEach(r => {
    rows.push([
      PRODUCT_NAMES[r.product_id] || ('Produto #' + r.product_id),
      r.customer_name || '',
      r.rating,
      r.comment || '',
      statusLabel[r.status] || r.status,
      fmtDate(r.created_at),
    ]);
  });
  downloadCsv('avaliacoes-' + todayStr() + '.csv', rows);
}

document.getElementById('searchInp').addEventListener('input', () => { currentPage = 1; renderList(); });
document.getElementById('exportCsvBtn').addEventListener('click', exportAvaliacoesCsv);

window.approveReview = async function (id) { await window.sb.from('reviews').update({ status: 'approved' }).eq('id', id); loadReviews(); };
window.rejectReview = async function (id) { await window.sb.from('reviews').update({ status: 'rejected' }).eq('id', id); loadReviews(); };
window.removeReview = async function (id) {
  if (!confirm('Excluir esta avaliação permanentemente?')) return;
  await window.sb.from('reviews').delete().eq('id', id);
  loadReviews();
};

(async function () {
  const session = await AdminShell.init('avaliacoes');
  if (!session) return;
  canModerate = AdminShell.can('avaliacoes.moderar');
  await loadReviews();
})();
</script>
</body>
</html>
